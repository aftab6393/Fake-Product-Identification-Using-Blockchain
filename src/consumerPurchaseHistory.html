<!doctype html>
<html lang="en">
  <head>
    <title>Fake Product Identification</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href='https://fonts.googleapis.com/css?family=Roboto:400,100,300,700' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
      :root {
        --primary: #2563eb;
        --accent: #f97316;
        --card-bg: rgba(255, 255, 255, 0.82);
        --blur: blur(14px);
        --shadow: 0 15px 45px rgba(15,23,42,0.22);
        --text-main: #111827;
        --text-muted: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Roboto', sans-serif;
        background:
          radial-gradient(circle at top left, #4acbf3, #007bff);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* NAVBAR – upgraded to match others */
      .navbar {
        background-image: linear-gradient(90deg, #2563eb, #4f46e5, #ec4899);
        padding: 12px 20px;
        box-shadow: 0 6px 20px rgba(15, 23, 42, 0.35);
      }

      .navbar-brand {
        font-size: 1.2rem;
        font-weight: bold;
        color: #fefce8 !important;
      }

      .navbar-brand span {
        font-size: 0.85rem;
        color: #e5e7eb;
        margin-left: 4px;
      }

      .nav-link {
        color: #e5e7eb !important;
        margin-left: 10px;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        padding: 6px 12px !important;
        border-radius: 999px;
        position: relative;
        transition: 0.2s ease;
      }

      .nav-link::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 4px;
        transform: translateX(-50%);
        width: 0;
        height: 2px;
        background: rgba(255,255,255,0.9);
        border-radius: 999px;
        transition: width 0.2s ease;
      }

      .nav-link:hover,
      .nav-link:focus {
        color: #ffffff !important;
        background-color: rgba(15,23,42,0.35);
        transform: translateY(-1px);
      }

      .nav-link:hover::after,
      .nav-link:focus::after {
        width: 50%;
      }

      .navbar-toggler {
        border: none;
      }

      .navbar-toggler .fa-bars {
        color: #ffffff;
        font-size: 1.1rem;
      }

      /* PAGE LAYOUT */
      section {
        padding: 32px 16px 0;
      }

      /* Only style content containers, not navbar container-fluid */
      section .container {
        background: var(--card-bg);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
        padding: 26px 22px 22px;
        border-radius: 18px;
        box-shadow: var(--shadow);
        max-width: 800px;
        margin: 20px auto;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      section .container::before {
        content: "";
        position: absolute;
        width: 130px;
        height: 130px;
        background: radial-gradient(circle, rgba(37,99,235,0.18), transparent 65%);
        top: -40px;
        right: -40px;
        opacity: 0.7;
      }

      section .container::after {
        content: "";
        position: absolute;
        width: 110px;
        height: 110px;
        background: radial-gradient(circle, rgba(248,113,22,0.22), transparent 65%);
        bottom: -40px;
        left: -40px;
        opacity: 0.7;
      }

      section .container > * {
        position: relative;
        z-index: 1;
      }

      h2 {
        font-size: 1.6rem;
        font-weight: 700;
        margin-bottom: 16px;
        color: #1d4ed8;
      }

      .form-group {
        text-align: left;
        margin-bottom: 16px;
      }

      label {
        font-weight: 600;
        color: #374151;
        display: block;
        margin-bottom: 6px;
      }

      .form-control {
        border-radius: 10px;
        padding: 10px 11px;
        border: 1px solid #cbd5e1;
        font-size: 0.95rem;
        transition: 0.18s ease;
      }

      .form-control:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 1px rgba(37,99,235,0.35);
      }

      .btn-register {
        display: inline-block;
        margin-top: 10px;
        background: linear-gradient(135deg, #f97316, #fbbf24);
        color: #111827;
        border: none;
        padding: 10px 22px;
        font-size: 0.98rem;
        font-weight: 600;
        border-radius: 999px;
        cursor: pointer;
        transition: 0.22s ease;
        box-shadow: 0 12px 28px rgba(249,115,22,0.35);
      }

      .btn-register:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 32px rgba(249,115,22,0.45);
      }

      .btn-register:active {
        transform: translateY(0);
        box-shadow: 0 8px 20px rgba(249,115,22,0.45);
      }

      /* TABLE STYLING */
      .table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        border-radius: 14px;
        overflow: hidden;
        background: #ffffff;
      }

      .table thead {
        background-color: #111827;
        color: white;
      }

      .table th,
      .table td {
        padding: 10px;
        text-align: center;
        font-size: 0.9rem;
        border: 1px solid #e5e7eb;
      }

      .table tbody tr:nth-child(even) {
        background-color: #f9fafb;
      }

      .table tbody tr:hover {
        background-color: rgba(148,163,184,0.18);
      }

      #add {
        color: var(--primary);
        font-weight: 600;
      }

      footer {
        background-color: #0f172a;
        color: #e5e7eb;
        text-align: center;
        padding: 16px 10px;
        margin-top: 20px;
        font-size: 0.9rem;
        border-top: 1px solid rgba(148,163,184,0.5);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Fake Product Identification <span>through Blockchain</span></a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav">
          <span class="fa fa-bars"></span>
        </button>
        <div class="collapse navbar-collapse" id="ftco-nav">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="manufacturer.html" class="nav-link">Manufacturer</a></li>
            <li class="nav-item"><a href="seller.html" class="nav-link">Seller</a></li>
            <li class="nav-item"><a href="consumer.html" class="nav-link">Consumer</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <section>
      <div class="container">
        <h2 style="color: #007bff;">Consumer Product History</h2>
        <div class="form-group">
          <label for="consumerCode">Consumer Code</label>
          <input type="text" class="form-control" id="consumerCode" placeholder="Enter Consumer Code" name="consumerCode">
        </div>
        <button type="submit" class="btn btn-warning btn-register" id="register">Get Products</button>
      </div>
    </section>

    <section>
      <div class="container">
        <h2>Products Purchased by Consumer</h2>
        <table class="table">
          <thead>
            <tr>
              <th>Product SN</th>
              <th>Seller Code</th>
              <th>Manufacturer Code</th>
            </tr>
          </thead>
          <tbody id="logdata"></tbody>
        </table>
        <center><p>Your address is <b id="add"></b></p></center>
      </div>
    </section>

    <footer>
      <p>&copy; 2024 Fake Product Identification. All Rights Reserved.</p>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="js/popper.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/web3.min.js"></script>
    <script src="js/truffle-contract.js"></script>
    <script src="js/consumerPurchaseHistory.js"></script>
  </body>
</html>
